    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
      // "1. Cài đặt" -> "1-cai-dat" (để liên kết #1-cai-dat từ trang chủ nhảy đúng mục).
      const slug = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      fetch("HUONG_DAN.md")
        .then((r) => (r.ok ? r.text() : Promise.reject()))
        .then((md) => {
          const el = document.getElementById("guide");
          el.innerHTML = marked.parse(md);
          el.querySelectorAll("h1,h2,h3").forEach((h) => { h.id = slug(h.textContent); });
          if (location.hash) {
            const t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            if (t) t.scrollIntoView();
          }
        })
        .catch(() => {
          document.getElementById("guide").innerHTML =
            '<p>Không tải được hướng dẫn. Bạn có thể đọc trực tiếp ở <a href="HUONG_DAN.md">HUONG_DAN.md</a>.</p>';
        });
    </script>
